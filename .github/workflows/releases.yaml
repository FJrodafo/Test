name: Releases
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]*'  # 1.0.0, 2.1.3, 1.0.0-beta, etc.

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
      - name: Verify Cosign installation
        run: cosign version

      # 3. Package the full source code
      - name: Package source code
        run: |
          git archive --format=zip HEAD -o test-${{ github.ref_name }}.zip
          git archive --format=tar.gz HEAD -o test-${{ github.ref_name }}.tar.gz

      # 4. Package each folder in /Packages separately
      - name: Package /Packages folders
        run: |
          declare -A SNAKE_NAMES=(
            [Apache_Maven]="apache_maven"
            [Containers]="containers"
            [npm]="npm"
            [NuGet]="nuget"
            [RubyGems]="rubygems"
          )
          for PACKAGE in Apache_Maven Containers npm NuGet RubyGems; do
            SNAKE="${SNAKE_NAMES[$PACKAGE]}"
            zip -r "${SNAKE}-${{ github.ref_name }}.zip" "Packages/${PACKAGE}"
            tar -czf "${SNAKE}-${{ github.ref_name }}.tar.gz" "Packages/${PACKAGE}"
          done

      # 5. Sign all artifacts
      - name: Sign artifacts
        run: |
          # Sign source code
          sha256sum test-${{ github.ref_name }}.zip test-${{ github.ref_name }}.tar.gz > test-${{ github.ref_name }}.sha256
          cosign sign-blob --yes --bundle "test-${{ github.ref_name }}.sigstore.json" "test-${{ github.ref_name }}.sha256"

          # Sign /Packages folders
          for SNAKE in apache_maven containers npm nuget rubygems; do
            sha256sum "${SNAKE}-${{ github.ref_name }}.zip" "${SNAKE}-${{ github.ref_name }}.tar.gz" > "${SNAKE}-${{ github.ref_name }}.sha256"
            cosign sign-blob --yes --bundle "${SNAKE}-${{ github.ref_name }}.sigstore.json" "${SNAKE}-${{ github.ref_name }}.sha256"
          done

      # 6. Create the GitHub release and upload artifacts (softprops)
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            *.zip
            *.tar.gz
            *.sha256
            *.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Attest artifacts (automatic verification tick)
      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            *-${{ github.ref_name }}.zip
            *-${{ github.ref_name }}.tar.gz
          push-to-release: true
          push-to-registry: true
